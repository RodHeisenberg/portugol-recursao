<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missão Recursão - Aula 05</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--text:#e5e7eb;--muted:#94a3b8;--accent:#60a5fa;--good:#34d399;--bad:#f87171;--line:#334155}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#0f172a,#111827);color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:6px}.badge{background:#172554;border:1px solid #1d4ed8;padding:10px 14px;border-radius:12px;min-width:180px;text-align:center}.progress{height:10px;background:#0b1220;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:18px 0 24px}.bar{height:100%;width:0;background:var(--accent);transition:.3s}.card{background:rgba(17,24,39,.96);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 25px rgba(0,0,0,.22)}.stage-title{font-size:22px;margin:0 0 10px}.story{color:#cbd5e1;line-height:1.55}.box{background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}pre{font-family:Consolas,"Courier New",monospace;white-space:pre-wrap;line-height:1.5;margin:0;color:#dbeafe}.options{display:grid;gap:10px;margin-top:14px}button,.linkbtn{border:0;border-radius:10px;padding:12px 14px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}.option{text-align:left;background:#1e293b;color:var(--text);border:1px solid #475569}.option:hover{border-color:var(--accent)}.primary{background:#2563eb;color:#fff}.secondary{background:#334155;color:#fff}.hint{background:#422006;color:#fde68a}.success{background:#065f46;color:#fff}.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;display:none}.feedback.good{display:block;background:#052e2b;border:1px solid #047857;color:#a7f3d0}.feedback.bad{display:block;background:#3f1515;border:1px solid #b91c1c;color:#fecaca}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.small{font-size:13px;color:var(--muted)}input{width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0b1220;color:white;font-size:16px}.result{text-align:center;padding:24px 14px}.result h2{font-size:28px}.step{padding:12px 14px;border-left:4px solid #2563eb;background:#0b1220;margin:10px 0;border-radius:8px}.lab-title{display:inline-block;background:#172554;border:1px solid #1d4ed8;padding:7px 10px;border-radius:999px;font-size:13px;margin-bottom:10px}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Missão Recursão</h1><div class="sub">10 desafios + laboratório final no Portugol Web Studio.</div></div><div class="badge"><div><strong id="stageCount">Questão 1 de 10</strong></div><div class="small">Tempo sugerido: 25 a 30 min</div></div></header>
<div class="progress"><div class="bar" id="bar"></div></div>
<main class="card" id="game"></main>
</div>
<script>
const stages=[
{title:"Questão 1 - O eco",story:"Uma função chama a si mesma com um número menor. Antes de executar, descubra o que ela fará.",html:`<div class="box"><pre>funcao eco(inteiro n)\n{\n    escreva(n, " ")\n    se(n > 1)\n    {\n        eco(n - 1)\n    }\n}\n\neco(4)</pre></div><p>Qual será a saída?</p>`,options:["1 2 3 4","4 3 2 1","4 4 4 4","Nunca termina"],answer:1,explain:"A função começa em 4 e chama a si mesma com n - 1 até chegar a 1.",hint:"Observe que o valor de n diminui a cada chamada."},
{title:"Questão 2 - Encontre o freio",story:"Toda recursão precisa de uma condição que faça as chamadas pararem.",html:`<div class="box"><pre>funcao contagem(inteiro n)\n{\n    escreva(n, " ")\n    contagem(n - 1)\n}</pre></div><p>O que está faltando?</p>`,options:["Uma variável real","Um caso base","Um laço para","Um segundo programa"],answer:1,explain:"O caso base é a condição de parada da recursão.",hint:"Pense em uma regra que diga: agora pare."},
{title:"Questão 3 - Complete a condição",story:"Agora escolha a condição que deve interromper uma contagem regressiva.",html:`<div class="box"><pre>funcao contagem(inteiro n)\n{\n    se( ??? )\n    {\n        retorne\n    }\n    escreva(n, " ")\n    contagem(n - 1)\n}</pre></div><p>Qual condição faz mais sentido?</p>`,options:["n == 0","n > 0","n == 100","n < 1000"],answer:0,explain:"Quando n chega a 0, a função para.",hint:"O valor está diminuindo. Em qual valor ele deve parar?"},
{title:"Questão 4 - O fatorial",story:"No fatorial, o problema é reduzido para uma versão menor dele mesmo.",html:`<div class="box"><pre>4! = 4 × 3 × 2 × 1\n4! = 4 × 3!\n3! = 3 × 2!\n2! = 2 × 1!\n1! = 1</pre></div><p>Qual expressão representa corretamente o passo recursivo?</p>`,options:["retorne numero + fatorial(numero - 1)","retorne numero * fatorial(numero - 1)","retorne fatorial(numero)","retorne numero * numero"],answer:1,explain:"O fatorial de n é n multiplicado pelo fatorial de n - 1.",hint:"Fatorial usa multiplicação."},
{title:"Questão 5 - Vai e volta",story:"A chamada recursiva acontece antes do escreva. Tente prever a ordem.",html:`<div class="box"><pre>funcao teste(inteiro n)\n{\n    se(n == 0)\n    {\n        retorne\n    }\n    teste(n - 1)\n    escreva(n, " ")\n}\n\nteste(3)</pre></div><p>Qual será a saída?</p>`,options:["3 2 1","1 2 3","3 3 3","0 1 2 3"],answer:1,explain:"As chamadas descem até 0. Depois, na volta, são impressos 1, 2 e 3.",hint:"Primeiro a função desce. Depois ela volta."},
{title:"Questão 6 - Somador recursivo",story:"Agora complete uma função que soma todos os números de n até 1.",html:`<div class="box"><pre>funcao inteiro soma(inteiro n)\n{\n    se(n <= 1)\n    {\n        retorne n\n    }\n    retorne ______________________\n}</pre></div><p>Complete corretamente o retorno:</p>`,options:["n + soma(n - 1)","n * soma(n - 1)","soma(n)","n + soma(n + 1)"],answer:0,explain:"soma(4) = 4 + soma(3), até chegar ao caso base.",hint:"Mantenha o n atual e resolva o restante com n - 1."},
{title:"Questão 7 - Caminhando para o caso base",story:"Uma recursão precisa avançar em direção à condição de parada.",html:`<div class="box"><pre>funcao regressiva(inteiro n)\n{\n    se(n == 0)\n    {\n        retorne\n    }\n    escreva(n, " ")\n    regressiva( ??? )\n}</pre></div><p>Qual chamada faz a função caminhar corretamente para o caso base?</p>`,options:["n + 1","n - 1","n * 2","n"],answer:1,explain:"Como o caso base é n == 0, o valor precisa diminuir.",hint:"Pergunte: qual opção aproxima n de zero?"},
{title:"Questão 8 - Recursão ou repetição?",story:"Nem todo problema precisa de recursão. Às vezes um laço resolve de forma mais simples.",html:`<div class="box"><pre>para(inteiro i = 5; i >= 1; i--)\n{\n    escreva(i, " ")\n}</pre></div><p>Qual alternativa descreve melhor esse código?</p>`,options:["É recursivo porque repete uma ação","É iterativo porque usa um laço","É recursivo porque usa uma variável","Não é possível saber"],answer:1,explain:"Repetição com para ou enquanto é iteração. Recursão envolve uma função chamando a si mesma.",hint:"Procure por chamada da própria função."},
{title:"Questão 9 - Descubra o resultado",story:"Agora faça o cálculo seguindo as chamadas.",html:`<div class="box"><pre>funcao inteiro soma(inteiro n)\n{\n    se(n == 1)\n    {\n        retorne 1\n    }\n    retorne n + soma(n - 1)\n}\n\nsoma(5)</pre></div><p>Qual valor será retornado?</p>`,options:["5","10","15","25"],answer:2,explain:"5 + 4 + 3 + 2 + 1 = 15.",hint:"Expanda a chamada: 5 + soma(4), depois 4 + soma(3)..."},
{title:"Questão 10 - Caça ao erro",story:"Este código tem caso base, mas mesmo assim existe um problema.",html:`<div class="box"><pre>funcao contagem(inteiro n)\n{\n    se(n == 0)\n    {\n        retorne\n    }\n    escreva(n, " ")\n    contagem(n + 1)\n}</pre></div><p>Qual é o erro principal?</p>`,options:["A função não possui caso base","O valor se afasta do caso base","O escreva deveria ser leia","Uma função recursiva não pode receber parâmetros"],answer:1,explain:"O caso base é 0, mas n + 1 faz o valor crescer e se afastar de zero.",hint:"Compare a direção da chamada com o valor do caso base."}
];
let current=0,score=0,attempts=0,labNumber=null,labAnswer=null;
function render(){const s=stages[current];document.getElementById('stageCount').textContent=`Questão ${current+1} de ${stages.length}`;document.getElementById('bar').style.width=`${(current/stages.length)*90}%`;const opts=s.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}) ${o}</button>`).join('');document.getElementById('game').innerHTML=`<h2 class="stage-title">${s.title}</h2><p class="story">${s.story}</p>${s.html}<div class="options">${opts}</div><div id="feedback" class="feedback"></div><div class="footer-actions"><button class="hint" onclick="hint()">Ver dica</button></div>`}
function answer(i){const s=stages[current],fb=document.getElementById('feedback');attempts++;if(i===s.answer){score++;fb.className='feedback good';fb.innerHTML=`<strong>Correto.</strong> ${s.explain}<div class="footer-actions"><button class="primary" onclick="next()">Próxima</button></div>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true)}else{fb.className='feedback bad';fb.innerHTML='<strong>Ainda não.</strong> Tente novamente observando a lógica das chamadas.'}}
function hint(){alert(stages[current].hint)}
function next(){current++;if(current<stages.length)render();else renderLab()}
function generateLab(){labNumber=Math.floor(Math.random()*5)+4;labAnswer=(labNumber*(labNumber+1))/2}
function renderLab(){generateLab();document.getElementById('stageCount').textContent='Atividade final';document.getElementById('bar').style.width='95%';const code=`programa\n{\n    funcao inicio()\n    {\n        inteiro numero = ${labNumber}\n\n        escreva("Calculando a soma de 1 ate ", numero, "...\\n")\n        escreva("Resultado: ", soma(numero))\n    }\n\n    funcao inteiro soma(inteiro n)\n    {\n        se(n <= 1)\n        {\n            retorne n\n        }\n\n        retorne n + soma(n - 1)\n    }\n}`;document.getElementById('game').innerHTML=`<div class="lab-title">LABORATÓRIO FINAL</div><h2 class="stage-title">Agora é no Portugol Web Studio</h2><p class="story">Copie o código abaixo, abra o Portugol Web Studio, cole, execute e observe o resultado. Depois volte para esta página e digite somente o número mostrado após <strong>Resultado:</strong>.</p><div class="step"><strong>1.</strong> Copie todo o código gerado abaixo.</div><div class="box"><pre id="labCode"></pre></div><div class="footer-actions"><button class="secondary" onclick="copyCode()">Copiar código</button><a class="linkbtn primary" href="https://portugol.dev/" target="_blank">Abrir Portugol Web Studio</a></div><div class="step"><strong>2.</strong> Cole o código no Portugol Web Studio e clique em executar.</div><div class="step"><strong>3.</strong> Volte aqui e informe o resultado exibido.</div><label for="labInput"><strong>Qual foi o resultado?</strong></label><input id="labInput" type="number" placeholder="Digite somente o número"><div class="footer-actions"><button class="success" onclick="checkLab()">Validar resposta</button><button class="hint" onclick="showLabHint()">Preciso de uma dica</button></div><div id="labFeedback" class="feedback"></div>`;document.getElementById('labCode').textContent=code}
function copyCode(){const text=document.getElementById('labCode').innerText;navigator.clipboard.writeText(text).then(()=>alert('Código copiado. Agora cole no Portugol Web Studio.')).catch(()=>alert('Selecione o código manualmente e copie.'))}
function checkLab(){const value=Number(document.getElementById('labInput').value),fb=document.getElementById('labFeedback');if(value===labAnswer){fb.className='feedback good';fb.innerHTML=`<strong>Resposta correta.</strong> Você executou o código e chegou ao resultado esperado.<div class="footer-actions"><button class="primary" onclick="finish()">Concluir missão</button></div>`;document.getElementById('bar').style.width='100%'}else{fb.className='feedback bad';fb.innerHTML='<strong>Resposta incorreta.</strong> Volte ao Portugol Web Studio, execute novamente e confira o número exibido após "Resultado:".'}}
function showLabHint(){alert('A função soma n com o resultado de soma(n - 1) até chegar a 1. Mas não faça a conta aqui: execute o código no Portugol Web Studio.')}
function finish(){document.getElementById('stageCount').textContent='Missão concluída';document.getElementById('bar').style.width='100%';document.getElementById('game').innerHTML=`<div class="result"><h2>Missão concluída</h2><p>Você completou as 10 questões e executou o desafio final no Portugol Web Studio.</p><div class="box"><pre>Antes de criar uma recursão, pergunte:\n\n1. Qual é o caso base?\n2. O problema fica menor a cada chamada?\n3. A chamada está se aproximando do caso base?</pre></div><p><strong>Pontuação nas questões:</strong> ${score}/${stages.length}</p><p class="small">Tentativas realizadas nas questões: ${attempts}</p><div class="footer-actions" style="justify-content:center"><button class="primary" onclick="restart()">Jogar novamente</button></div></div>`}
function restart(){current=0;score=0;attempts=0;labNumber=null;labAnswer=null;render()}
render();
</script>
</body>
</html>
